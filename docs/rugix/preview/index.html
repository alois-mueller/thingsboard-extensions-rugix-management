<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rugix Management – Preview</title>
<style>
@font-face{font-family:'Material Icons';src:url(fonts/material-icons.woff2) format('woff2')}
@font-face{font-family:Roboto;font-weight:400;src:url(fonts/roboto-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Roboto;font-weight:500;src:url(fonts/roboto-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Roboto Mono';src:url(fonts/roboto-mono-latin-400-normal.woff2) format('woff2')}
body{margin:0;background:#eee;font:14px Roboto,Arial,sans-serif;color:rgba(0,0,0,.87)}
.mi{font-family:'Material Icons';font-weight:400;font-size:20px;line-height:1;vertical-align:middle;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
.card{margin:16px;background:#fff;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.hdr{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid #ddd;flex-wrap:wrap}
.ttl{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:500;flex:1}
.cnt{font-size:12px;padding:0 8px;border-radius:10px;background:#0001}
input.s{padding:8px 12px;border:1px solid #bbb;border-radius:4px;width:200px}
button{font:inherit;padding:6px 14px;border-radius:4px;border:1px solid #305680;background:#fff;color:#305680;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.p{background:#305680;color:#fff}button.w{color:#c62828;border-color:#c62828}button:disabled{opacity:.4;cursor:default}
button.i{border:0;padding:4px;background:none;color:#555}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:#0008;padding:10px 12px;border-bottom:1px solid #ddd}
td{padding:8px 12px;border-bottom:1px solid #0000000f}tbody tr{cursor:pointer}tbody tr:hover{background:#00000008}tr.sel{background:#3056801a}
.sub{font-size:12px;color:#0008}.nm{font-weight:500}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:500}.st i{width:8px;height:8px;border-radius:50%;background:currentColor}
.on{color:#4caf50}.off{color:#0006}
.pill{display:inline-block;padding:1px 10px;border-radius:10px;font-size:12px;background:#0001}
.ok{color:#2e7d32;background:#4caf5026}.warn{color:#e65100;background:#ff98002e;margin-left:6px}.err{color:#c62828;background:#f4433626}.run{color:#1565c0;background:#2196f326}
.det{margin:12px 16px 16px;border:1px solid #ddd;border-radius:6px}
.dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid #ddd;flex-wrap:wrap}.dh .t{font-size:18px;font-weight:500;flex:1}
.ban{display:flex;align-items:center;gap:10px;margin:12px 16px 0;padding:8px 12px;border-radius:4px;background:#ff98002b;color:#8a4600}.ban span{flex:1}
.tabs{display:flex;border-bottom:1px solid #ddd;margin-top:8px}.tab{padding:12px 20px;cursor:pointer;color:#0009;border-bottom:2px solid transparent}.tab.a{color:#305680;border-color:#305680}
.body{padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.kv span{display:block;font-size:12px;color:#0008}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.slot{padding:12px;border:1px solid #ddd;border-radius:6px}.slot.a{border-color:#4caf50;background:#4caf500f}
.hash{font:11px 'Roboto Mono',monospace;color:#0009;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center}.ov.show{display:flex}
.dlg{background:#fff;border-radius:4px;width:560px;max-width:95vw;max-height:90vh;overflow:auto}.dlg .tb{background:#305680;color:#fff;padding:14px 24px;font-size:18px;font-weight:500;display:flex}.dlg .tb span{flex:1}
.dlg .c{padding:20px 24px;display:flex;flex-direction:column;gap:8px}.dlg .f{display:flex;justify-content:flex-end;gap:8px;padding:8px 24px 16px}
.lbl{font-size:12px;font-weight:500;text-transform:uppercase;color:#0008;margin-top:6px}select,input.t{padding:10px;border:1px solid #bbb;border-radius:4px;font:inherit}
.bar{height:4px;background:#2196f333}.bar div{height:100%;background:#305680;width:0;transition:width .4s}
pre{margin:0;padding:10px 12px;background:#1f2430;color:#d6deeb;border-radius:4px;font:12px/1.5 'Roboto Mono',monospace;max-height:240px;overflow:auto;white-space:pre-wrap}
pre .m{color:#82aaff}pre .t{color:#7f8aa3;margin-right:8px}
.note{margin:16px;padding:10px 14px;background:#fff8e1;border-radius:4px;font-size:13px}

.dlg{width:min(560px,92vw)}.tbl{overflow-x:auto}.tabs{overflow-x:auto}.tab{white-space:nowrap}
@media(max-width:900px){.c-md{display:none}}
@media(max-width:600px){.c-sm{display:none}.card,.note{margin:8px}.ttl{width:100%;flex:1 1 100%}input.s{width:100%;order:3;flex:1 1 100%;box-sizing:border-box}
.hdr>button{flex:1 1 auto;justify-content:center}th,td{padding:8px 6px}.det{margin:8px 0 0;border-left:0;border-right:0;border-radius:0}
.dh{padding:12px}.dh button{flex:1 1 calc(50% - 8px);justify-content:center}.ban{flex-wrap:wrap;margin:12px 12px 0}.body{padding:12px}.tab{padding:12px 14px}}
</style></head><body>
<div class="note">Static preview of <b>tb-rugix-agents</b> with mock data (Material look as in ThingsBoard). Click a row, tabs, “Install update” or “Commit”.</div>
<div class="card" id="root"></div>
<div class="ov" id="ov"><div class="dlg" id="dlg"></div></div>
<script>
const devs=[
{n:'Testanlage_Felix_Rugix',l:'Testanlage Felix',on:1,bf:'tryboot',ag:'b',dg:'a',st:'active',v:'0.1.4',job:'succeeded',dp:'/dev/mmcblk0p4',
 slots:[['boot-a',0,'67 MiB'],['boot-b',1,'67 MiB'],['system-a',0,'1.2 GiB'],['system-b',1,'1.3 GiB']],
 apps:[['node-red','running',3,'compose'],['modbus-bridge','stopped',1,'systemd']]},
{n:'Anlage_Nord_RevPi_02',l:'Anlage Nord 02',on:1,bf:'tryboot',ag:'a',dg:'a',st:'active',v:'0.1.4',job:'succeeded',dp:'/dev/mmcblk0p4',slots:[['boot-a',1,'67 MiB'],['boot-b',0,'67 MiB'],['system-a',1,'1.2 GiB'],['system-b',0,'1.2 GiB']],apps:[['node-red','running',2,'compose']]},
{n:'Anlage_Sued_RevPi_03',l:'Anlage Süd 03',on:0,bf:'tryboot',ag:'a',dg:'a',st:'error',v:'0.1.3',job:'failed',dp:'—',slots:[],apps:[]}];
let sel=0,tab=0,chk=new Set(),jt;
const $=id=>document.getElementById(id);
const pill=(t,c='')=>`<span class="pill ${c}">${t}</span>`;
function render(){
 $('root').innerHTML=`<div class="hdr"><div class="ttl"><i class="mi">developer_board</i>Rugix Management<span class="cnt">${devs.length}</span></div>
 <input class="s" placeholder="Search devices">
 <button ${chk.size?'':'disabled'} onclick="inst()"><i class="mi">system_update_alt</i>Update system (${chk.size})</button>
 <button ${chk.size?'':'disabled'}><i class="mi">apps</i>Install app (${chk.size})</button></div>
 <table><thead><tr><th></th><th>Device</th><th>Status</th><th class="c-md">Boot flow</th><th>Active group</th><th class="c-sm">State</th><th class="c-md">Rugix API</th><th class="c-md">Last job</th><th></th></tr></thead><tbody>
 ${devs.map((d,i)=>`<tr class="${i==sel?'sel':''}" onclick="sel=${i}==sel?-1:${i};tab=0;render()"><td onclick="event.stopPropagation()"><input type=checkbox ${chk.has(i)?'checked':''} onchange="this.checked?chk.add(${i}):chk.delete(${i});render()"></td>
 <td><div class="nm">${d.l}</div><div class="sub">${d.n}</div></td><td><span class="st ${d.on?'on':'off'}"><i></i>${d.on?'Online':'Offline'}</span></td><td class="c-md">${d.bf}</td>
 <td>${d.ag}${d.ag!=d.dg?pill('commit pending','warn'):''}</td><td class="c-sm">${pill(d.st,d.st=='active'?'ok':'err')}</td><td class="c-md">${d.v}</td><td class="c-md">${pill(d.job,d.job=='succeeded'?'ok':'err')}</td><td><i class="mi">more_vert</i></td></tr>`).join('')}
 </tbody></table>${sel>=0?details(devs[sel]):''}`;
}
function details(d){
 const acts=[['restart_alt','Reboot'],['swap_horiz','Reboot into spare'],['task_alt','Commit running system'],['delete_forever','Factory reset','w']];
 const T=['Overview','Slots ('+d.slots.length+')','Apps ('+d.apps.length+')','Components','Last job'];
 let b='';
 if(tab==0)b=`<div class="grid">${[['Boot flow',d.bf],['Boot groups','a, b'],['Active group',d.ag],['Default group',d.dg],['State management',d.st],['Data partition',d.dp],['Components consistent','yes']].map(k=>`<div class="kv"><span>${k[0]}</span><b>${k[1]}</b></div>`).join('')}</div>`;
 if(tab==1)b=`<div class="slots">${d.slots.map(s=>`<div class="slot ${s[1]?'a':''}"><b><i class="mi">${s[0].startsWith('boot')?'memory':'storage'}</i> ${s[0]}</b> ${s[1]?pill('active','ok'):''}<div class="sub">${s[2]} · updated 24.11.2026</div><div class="hash">sha256: 9f2c4be1a7d03c55…</div></div>`).join('')||'No slot information.'}</div>`;
 if(tab==2)b=`<table><thead><tr><th>App</th><th>Status</th><th>Generation</th><th>Orchestrator</th><th></th></tr></thead><tbody>${d.apps.map(a=>`<tr style="cursor:default"><td><b>${a[0]}</b></td><td>${pill(a[1],a[1]=='running'?'ok':'')}</td><td>${a[2]}</td><td>${a[3]}</td><td><i class="mi">more_vert</i></td></tr>`).join('')}</tbody></table>`;
 if(tab==3)b=`<pre>{\n  "roots": ["/"],\n  "components": { "rugix.system": { "version": "0.8.3" } },\n  "consistent": true\n}</pre>`;
 if(tab==4)b=`<b>job-changed</b> · ${pill(d.job,d.job=='succeeded'?'ok':'err')} <br><br><button onclick="job()"><i class="mi">list_alt</i>Open job log</button>`;
 return `<div class="det"><div class="dh"><div class="t">${d.l}<div class="sub"><span class="st ${d.on?'on':'off'}"><i></i>${d.on?'Online':'Offline'}</span> · Rugix ${d.v}</div></div>
 ${acts.map(a=>`<button class="${a[2]||''}" onclick="${a[1].startsWith('Commit')?'job(true)':''}"><i class="mi">${a[0]}</i>${a[1]}</button>`).join('')}
 <button class="p" onclick="inst()"><i class="mi">system_update_alt</i>Install update</button></div>
 ${d.ag!=d.dg?`<div class="ban"><i class="mi">info</i><span>Running boot group <b>${d.ag}</b>, default is <b>${d.dg}</b>. Commit to keep the new system, otherwise it falls back on next reboot.</span><button class="p" onclick="job(true)">Commit</button></div>`:''}
 <div class="tabs">${T.map((t,i)=>`<div class="tab ${i==tab?'a':''}" onclick="tab=${i};render()">${t}</div>`).join('')}</div><div class="body">${b}</div></div>`;
}
function open_(h){$('dlg').innerHTML=h;$('ov').classList.add('show')}
function close_(){clearInterval(jt);$('ov').classList.remove('show')}
function inst(){const n=chk.size||1;open_(`<div class="tb"><span>Install system update</span><i class="mi" onclick="close_()">close</i></div><div class="c">
<div class="lbl">Target devices (${n})</div><div>${chk.size?[...chk].map(i=>pill(devs[i].l)).join(' '):pill(devs[sel>=0?sel:0].l)}</div>
<div class="lbl">Bundle</div><select><option>RevPi Image – 2026.11.2</option><option>RevPi Image – 2026.11.1</option></select><div class="sub">Only OTA packages with an external URL can be pulled by Rugix.</div>
<div class="lbl">After installation</div><label><input type=radio name=r checked> Install &amp; select – reboot later</label><label><input type=radio name=r> Install &amp; reboot</label><label><input type=radio name=r> Deferred</label><label><input type=radio name=r> Install only</label>
<label><input type=checkbox> Keep overlay of the target slot</label></div>
<div class="f"><button onclick="close_()">Cancel</button><button class="p" onclick="job()">Install</button></div>`)}
function job(commit){const L=commit?['job-changed: running','commit: switching default boot group to b','job-changed: succeeded']:['job-changed: running','Downloading bundle …','Verifying bundle signature','Writing slot system-b','Writing slot boot-b','Setting boot selection to b','job-changed: succeeded'];
 open_(`<div class="tb"><span>${commit?'Commit':'Install'}</span><i class="mi" onclick="close_()">close</i></div><div class="c"><div class="bar"><div id="b"></div></div><div class="sub" id="pc">Waiting for events…</div><pre id="lg"></pre></div><div class="f"><button onclick="close_()">Close</button></div>`);
 let i=0;jt=setInterval(()=>{if(i>=L.length)return clearInterval(jt);$('lg').innerHTML+=`<span class=t>${new Date().toLocaleTimeString()}</span><span class="${L[i].startsWith('job')?'m':''}">${L[i]}</span>\n`;const p=Math.round(++i/L.length*100);$('b').style.width=p+'%';$('pc').textContent='Installation progress: '+p+' %'},900)}
render();
</script></body></html>

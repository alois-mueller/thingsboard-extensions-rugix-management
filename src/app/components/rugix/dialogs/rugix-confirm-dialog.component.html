<mat-toolbar color="primary" class="rugix-dialog-toolbar">
  <h2 class="rugix-dialog-title">{{ data.title }}</h2>
  <span class="flex-1"></span>
  <button mat-icon-button type="button" (click)="cancel()" aria-label="Close"><mat-icon>close</mat-icon></button>
</mat-toolbar>
<div mat-dialog-content class="rugix-dialog-content">
  <p class="rugix-message">{{ data.message }}</p>
  @if (data.checkbox) {
    <mat-checkbox [(ngModel)]="checked">{{ data.checkbox.label }}</mat-checkbox>
  }
  @if (data.textWhenChecked && checked) {
    <mat-form-field appearance="outline" class="rugix-field">
      <mat-label>{{ data.textWhenChecked.label }}</mat-label>
      <input matInput [(ngModel)]="text">
    </mat-form-field>
  }
  @if (data.acknowledge) {
    <mat-checkbox class="rugix-ack" [(ngModel)]="acknowledged">{{ data.acknowledge }}</mat-checkbox>
  }
</div>
<div mat-dialog-actions class="rugix-dialog-actions">
  <span class="flex-1"></span>
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button type="button" [class.caution]="data.caution" [color]="data.warn ? 'warn' : (data.caution ? undefined : 'primary')" [disabled]="!canConfirm" (click)="confirm()">{{ data.confirmLabel }}</button>
</div>
